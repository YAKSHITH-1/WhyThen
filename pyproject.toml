[project]
name = "whythen"
version = "0.1.0"
description = "WhyThen: A Local-First, Time-Aware Personal Memory & Decision History Assistant"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "WhyThen Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "streamlit>=1.35.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
    "markdown>=3.6",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

